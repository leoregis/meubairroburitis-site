name: Limpeza segura de releases antigas (uma vez)

# Depois do incidente do deploy #194 (disco cheio derrubou o site, ver
# restaurar-emergencial.yml), limpa o acumulo de pastas _old_* +
# _release_36e01ea7 + _staging_test + wordpress_backup_2026 nunca
# apagadas (dezenas -- o numero exato varia a cada corrida, ver o
# "PLANO DE EXCLUSAO" impresso na Fase 2). _current ja foi restaurado
# manualmente e e a fonte de verdade boa -- por isso, diferente de uma
# limpeza de rotina, esta passada NAO mantem nenhuma _old_* como
# rollback extra. Fase 1 relista o servidor do zero a cada execucao,
# entao rodar este workflow mais de uma vez (ex.: se uma corrida nao
# terminar dentro do timeout) e seguro e idempotente -- so continua de
# onde a anterior parou, sem duplicar trabalho.
#
# 4 fases dentro do mesmo job, de proposito, pra nunca apagar as cegas:
#   1. lista o public_html de verdade (nlist, um nome por linha)
#   2. calcula EXPLICITAMENTE o plano de exclusao e imprime ANTES de
#      apagar qualquer coisa. "_current" nunca pode entrar nesse plano
#      por construcao (não bate com o regex _old_<numero> nem é um dos
#      3 nomes literais) -- e além disso tem uma checagem em runtime
#      que aborta o job se "_current" aparecer na lista por qualquer
#      motivo, e outra que aborta se "_current" não existir na
#      listagem atual (não repete o rm às cegas se o servidor não
#      estiver no estado esperado)
#   3. apaga cada nome da lista, com timestamp antes de cada item (log
#      em tempo real via "tee", nao buffer que so aparece no final --
#      se travar em algum item, a run anterior mostrou o custo de nao
#      ter essa visibilidade)
#   4. lista o public_html de novo e aponta qualquer coisa que sobrou
#      fora da lista esperada (_current + arquivos/pastas fixos do
#      hosting) -- essa é a verificação real, não um ls por item
on:
  workflow_dispatch:

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Fase 1 -- lista public_html
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF > listagem_antes.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          set cmd:fail-exit yes
          cd public_html
          nlist
          bye
          EOF
          echo "===== listagem ANTES (bruta) ====="
          cat listagem_antes.txt

      - name: Fase 2 -- calcula o plano de exclusao (so imprime, nao apaga nada ainda)
        run: |
          # TODAS as _old_* desta vez -- _current ja é a fonte de
          # verdade restaurada, nao precisa manter nenhuma como
          # rollback extra (diferente de uma limpeza de rotina).
          grep -E '^_old_[0-9]+$' listagem_antes.txt > apagar.txt || true

          # nomes confirmados manualmente, literais
          echo "_release_36e01ea7" >> apagar.txt
          echo "_staging_test" >> apagar.txt
          echo "wordpress_backup_2026" >> apagar.txt

          echo "===== PLANO DE EXCLUSAO (total: $(wc -l < apagar.txt) itens) ====="
          cat apagar.txt

          # "_current" nunca deveria aparecer aqui -- nao bate no regex
          # ^_old_[0-9]+$ acima nem e um dos 3 nomes literais. Checagem
          # explicita mesmo assim, em vez de confiar so na construcao:
          if grep -qx "_current" apagar.txt; then
            echo "ABORTANDO: _current apareceu no plano de exclusao. Isso nunca deveria acontecer -- parando antes de apagar qualquer coisa."
            exit 1
          fi

          if ! grep -qx "_current" listagem_antes.txt; then
            echo "ABORTANDO: _current nao aparece na listagem atual do public_html -- servidor nao esta no estado esperado, nao vou apagar nada as cegas."
            exit 1
          fi

      - name: Fase 3 -- apaga cada item (log em tempo real, ver Fase 4 pra verificacao)
        # 171 pastas, cada uma com um build inteiro do site (centenas/
        # milhares de arquivos) -- rm -rf via FTP apaga arquivo por
        # arquivo, sem atalho. Sem pressa (_current ja esta restaurado e
        # servindo o site) -- prefere terminar direito a terminar rapido.
        #
        # Tentativa anterior redirecionava a saida do lftp pra um arquivo
        # e só imprimia (cat) DEPOIS do lftp terminar -- se o lftp travar
        # ou demorar o timeout inteiro, a run morre sem nenhum log
        # intermediario, zero visibilidade de onde parou. Corrigido pra
        # "| tee" (grava no arquivo E imprime ao vivo simultaneamente),
        # com um timestamp antes de cada item pra medir quanto cada pasta
        # individual demora.
        #
        # Removido o "ls" de confirmacao por item (dobrava o numero de
        # idas-e-voltas via FTP: 342 comandos em vez de 171) -- a
        # verificacao real fica pra Fase 4, que relista TUDO no final e
        # aponta qualquer coisa fora do esperado. Mesma garantia, metade
        # do trafego.
        timeout-minutes: 300
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ssl:verify-certificate no"
            echo "set net:timeout 15"
            echo "set net:max-retries 3"
            echo "set cmd:fail-exit no"
            echo "cd public_html"
            while IFS= read -r nome; do
              [ -z "$nome" ] && continue
              printf '! date "+----- %%H:%%M:%%S apagando: %s -----"\n' "$nome"
              printf 'rm -rf %s\n' "$nome"
            done < apagar.txt
            echo '! date "+----- %H:%M:%S fim -----"'
            echo "bye"
          } > comandos.lftp
          echo "===== comandos que vao rodar ($(wc -l < apagar.txt) itens) ====="
          cat comandos.lftp
          # -f nao compoe com -u/URL posicional na mesma chamada (bug ja
          # corrigido antes) -- conecta via -u/URL e le os comandos do
          # stdin, redirecionando de arquivo em vez de heredoc.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" < comandos.lftp 2>&1 | tee resultado_fase3.txt
          exit 0

      - name: Fase 4 -- listagem final e conferencia contra o esperado
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF > listagem_depois.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          set cmd:fail-exit yes
          cd public_html
          nlist
          bye
          EOF
          echo "===== listagem DEPOIS (bruta) ====="
          cat listagem_depois.txt

          echo
          echo "===== o que sobrou fora do esperado (deveria estar vazio) ====="
          grep -vE '^(_current|\.htaccess|\.well-known|assets|cgi-bin|error_log|favicon\.svg|google[a-z0-9]*\.html|guia|icons\.svg|index\.html|robots\.txt|\.ftp-deploy-sync-state\.json|\.quarantine|\.tmb)$' listagem_depois.txt || echo "(nada sobrou fora do esperado)"
