name: Deploy

on:
  push:
    branches: [main]
    # 09/out: push que só mexe nestes caminhos não gera deploy (o build não
    # usa nenhum deles: .md da raiz, docs/ inexistente, supabase/ é só
    # migrations/functions publicadas à parte). Vale só pro push --
    # workflow_dispatch (fila e Guia) e schedule seguem iguais.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'supabase/**'
  # disparado via API do GitHub pela fila de publicação do admin
  # (deploy_fila no banco do site: só mudança pública, 3 min de calma --
  # ver edge function disparar_deploy_fila) e pelo Guia (empresa/prestador
  # criado, ativado ou desativado) -- o site e estatico (SSG), entao
  # qualquer mudanca no banco só aparece pro publico depois de um build novo.
  workflow_dispatch:
    # 09/out (build incremental, etapa 2): a fila manda os itens que mudaram
    # (deploy_fila_itens: tipo, ação, slug, slug/categoria antigos). Por
    # enquanto o build só REGISTRA os itens no log e continua completo; o
    # modo incremental (etapa 3) usa os itens pra gerar só as rotas afetadas.
    inputs:
      modo:
        description: 'auto = decide pelo que mudou (por enquanto sempre completo); completo = força build completo'
        required: false
        default: auto
        type: choice
        options: [auto, completo]
      itens:
        description: 'JSON com os itens da fila (preenchido pela fila; deixar vazio no disparo manual)'
        required: false
        default: ''
        type: string
  # 08/out: deploy diário às 05:30 UTC (02:30 em Brasília). Edição de nome,
  # descrição etc. de empresas/prestadores no Guia não dispara deploy (o
  # trigger do Guia só olha criação e ativo/inativo); este rebuild diário
  # garante que o site reflita essas edições em até ~24h. A limpeza de
  # releases (limpeza-releases.yml) roda logo depois, ao fim dele.
  schedule:
    - cron: '30 5 * * *'

# push e workflow_dispatch podem disparar quase juntos (ex: um push logo
# seguido de um salvamento no admin de produtos) -- sem isso, duas runs
# simultaneas calculam o MESMO nome de pasta de release (baseado no sha)
# e uma pode renomear public_html/_current pra baixo do tapete da outra
# no meio do swap, derrubando o site inteiro (já aconteceu). Fila em vez
# de cancelar: nunca queremos abortar um swap de FTP no meio do caminho.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Registra o pedido (origem, modo e itens da fila)
        # etapa 2: só registra -- o build abaixo continua completo.
        env:
          MODO: ${{ inputs.modo }}
          ITENS: ${{ inputs.itens }}
        run: |
          echo "evento: ${GITHUB_EVENT_NAME} | modo: ${MODO:-auto}"
          if [ -n "$ITENS" ]; then
            echo "$ITENS" > "$RUNNER_TEMP/itens.json"
            node -e "const i=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log(i.length+' item(ns) da fila:'); for (const x of i) console.log(' -', x.o||'site', x.t, x.a, x.s||x.id, x.sa?('(antes: '+x.sa+')'):'', x.ca?('(categoria antes: '+x.ca+')'):'')" "$RUNNER_TEMP/itens.json" || echo "::warning::itens da fila em formato inesperado (ignorados)"
          else
            echo "sem itens (push, schedule ou disparo manual)"
          fi

      - name: Calcula o buildId (hash do codigo, nao do conteudo)
        # mesmo codigo -> mesmo buildId -> mesmos chunks em _nuxt/ (ver
        # nuxt.config.ts). Vai pro _build.txt junto com o commit: e o que o
        # build incremental vai conferir antes de subir paginas soltas.
        run: |
          id=$(git rev-parse HEAD:app HEAD:nuxt.config.ts HEAD:package.json HEAD:package-lock.json | sha1sum | cut -c1-16)
          echo "MBB_BUILD_ID=$id" >> "$GITHUB_ENV"
          echo "buildId deste build: $id"

      - run: npm run generate
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
          # chave PÚBLICA do Mercado Pago (não é segredo -- só tokeniza
          # cartão no navegador via Card Payment Brick). Sem isso no build
          # de produção, o Brick sobe com a public key vazia e o checkout
          # por cartão quebra silenciosamente.
          NUXT_PUBLIC_MP_PUBLIC_KEY: ${{ secrets.NUXT_PUBLIC_MP_PUBLIC_KEY }}
          # Fase 4 -- projeto Supabase do meubairro-app, só pra enumerar
          # slugs de empresas/prestadores ativos em build-time (nitro:config
          # em nuxt.config.ts). Sem isso aqui, o hook pula essa enumeração
          # silenciosamente (if (urlMba && keyMba)) e o build "funciona" mas
          # nunca gera /empresas/[slug] nem /prestadores/[slug].
          NUXT_PUBLIC_MEUBAIRRO_APP_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_MEUBAIRRO_APP_SUPABASE_URL }}
          NUXT_PUBLIC_MEUBAIRRO_APP_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_MEUBAIRRO_APP_SUPABASE_ANON_KEY }}

      - name: Corrige escape duplo (&amp;amp;) nas imagens do sitemap.xml
        # o hook em nuxt.config.ts (prerender:generate) não é confiável --
        # o crawler de prerender do Nitro roda a partir de um bundle
        # próprio (.nuxt/prerender/), então o hook registrado no config
        # nem sempre chega até ele. Corrige aqui, direto no arquivo final
        # já escrito em disco, onde não tem ambiguidade nenhuma sobre se
        # rodou ou não.
        run: |
          if [ -f .output/public/sitemap.xml ]; then
            node -e "
              const fs = require('fs');
              const p = '.output/public/sitemap.xml';
              const antes = fs.readFileSync(p, 'utf8');
              const depois = antes.replaceAll('&amp;amp;', '&amp;');
              fs.writeFileSync(p, depois);
              console.log('sitemap.xml: substituicoes de &amp;amp; ->', (antes.match(/&amp;amp;/g) || []).length);
            "
          fi

      - name: Barra registro de teste publicado (sitemap e titles)
        # 07/out: registros de teste criados em produção ficaram semanas no
        # ar e no sitemap. Se o sitemap ou algum <title> gerado tiver
        # "teste", "apagar", "lorem" ou "dummy", o deploy para AQUI, antes
        # de subir qualquer coisa. Nome legítimo -> exceção com motivo em
        # scripts/checar-registros-teste.excecoes.json. Escopo: só /empresas
        # e /prestadores (dados do Guia) -- notícias e institucionais ficam
        # de fora ("teste do pezinho" é título legítimo).
        run: node scripts/checar-registros-teste.mjs .output/public

      - name: Confere se toda noticia publicada virou pagina no build
        # o prerender roda com failOnError:false -- pagina que quebra com
        # 500 no build some do site sem erro nenhum (7 materias sumiram
        # assim em 24/set e so foram notadas dias depois). Falha aqui, ANTES
        # do upload: o site no ar continua sendo a release anterior (com as
        # materias) ate a causa ser corrigida. Ver scripts/verificar-noticias-geradas.mjs.
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/verificar-noticias-geradas.mjs .output/public

      - name: Grava marcador do build (_build.txt) pra verificacao pos-swap
        # conferido via FTP depois do swap (step "Confirma que _current...")
        # pra provar que _current e ESTE build, sem depender de requisicao
        # HTTP passando pelo Cloudflare. run_attempt entra junto pra um
        # re-run do mesmo run_id tambem ter marcador proprio.
        # 09/out: uma linha com campos nomeados -- commit e build_id sao o que
        # o build incremental confere (mesmo codigo no ar?) antes de subir
        # paginas soltas.
        run: |
          echo "commit=${GITHUB_SHA} build_id=${MBB_BUILD_ID} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}" > .output/public/_build.txt
          cat .output/public/_build.txt
          grep -q "buildId:\"${MBB_BUILD_ID}\"" .output/public/index.html || { echo "ERRO: index.html nao tem o buildId ${MBB_BUILD_ID}"; exit 1; }

      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Incidente de 23/set: o deploy #194 falhou por "Disk quota
      # exceeded" no meio do mirror, mas o script continuava rodando com
      # cmd:fail-exit no ativo naquele ponto -- seguiu em frente e
      # renomeou o _current de producao pra _old_<ts> mesmo assim, sem
      # nunca conseguir colocar a release nova no lugar. Site inteiro
      # caiu pra 404 (nenhuma pasta _current sobrou). A correção deste
      # arquivo inteiro gira em torno de nunca mais deixar isso acontecer:
      # separar "subir e validar a release nova" de "trocar o _current"
      # em passos distintos, com fail-exit estrito no primeiro, pra que
      # um erro ali NUNCA chegue perto de tocar em _current.

      - name: Checa acumulo de releases antigas antes de subir (proxy pra espaco em disco)
        # FTP puro (RFC 959) nao tem comando nativo de cota/espaco livre
        # -- isso só existe via API HTTP separada do cPanel (UAPI), sem
        # credencial configurada neste projeto. Proxy pratico: com a
        # limpeza automatica funcionando (desde 08/out em workflow
        # separado, limpeza-releases.yml, disparado ao fim de cada deploy e
        # todo dia de madrugada -- fora do caminho deste deploy), nunca
        # deveria sobrar mais que ~3-5 pastas _old_* por muito tempo. Um
        # numero bem maior que isso e sinal de que a limpeza parou de
        # rodar em algum deploy anterior (ou falhou) -- mesmo padrao que
        # levou ao disco cheio de 23/set (chegou a 148+ pastas
        # acumuladas). Falha cedo em vez de arriscar repetir o incidente.
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF > listagem_pre.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          set cmd:fail-exit yes
          cd public_html
          nlist
          bye
          EOF

          QUANTIDADE=$(grep -cE '^(_old_[0-9]+|_release_[A-Za-z0-9_]+)$' listagem_pre.txt || true)
          echo "Pastas _old_*/_release_* encontradas: $QUANTIDADE"

          LIMITE=10
          if [ "$QUANTIDADE" -gt "$LIMITE" ]; then
            echo "ERRO: $QUANTIDADE pastas antigas encontradas (limite: $LIMITE) -- acumulo anormal, sinal de que a limpeza automatica parou de funcionar em algum deploy anterior. Abortando ANTES de subir a release nova, pra nao arriscar repetir o incidente de disco cheio de 23/set. Rode o workflow 'Diagnostico - Uso de disco no hosting' e investigue manualmente antes de tentar de novo."
            exit 1
          fi

      - name: Sobe a release nova pra uma pasta a parte (fail-exit estrito, nao toca em _current)
        timeout-minutes: 60
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          RELEASE="_release_${GITHUB_SHA::8}_${GITHUB_RUN_ID}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

          # ftps:// (porta 990, TLS implicito) trava a conexao TCP nessa
          # hospedagem -- confirmado com o deploy de staging (3 tentativas
          # até achar a causa: a conexão em si nunca abria). Essa mesma
          # conta de FTP já prova, com o ci.yml do meubairro-app e agora
          # com o deploy-staging.yml deste projeto, que funciona via FTPS
          # EXPLICITO (porta 21, upgrade AUTH TLS) -- ftp:ssl-force com o
          # esquema ftp://.
          #
          # cmd:fail-exit YES do inicio ao fim deste passo -- diferente de
          # antes, qualquer erro aqui (mkdir, mirror, disco cheio, o que
          # for) aborta o lftp inteiro imediatamente com codigo de saida
          # != 0, o que falha este step do GitHub Actions e interrompe o
          # job ANTES de chegar no passo de swap. _current nem e mencionado
          # neste passo -- fisicamente nao tem como esta etapa tocar nele.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          # 07/out: hospedagem limita a 8 conexões por IP ("421 Too many
          # connections (8)" derrubou o deploy de 07/out com --parallel=6).
          # 4 em paralelo (08/out; com 3 o envio levou 50 min, com 6 ~22 min
          # mas estourava o limite) + até 6 novas tentativas com espera
          # crescente (10s, 20s, 40s, teto 60s) nos erros de conexão.
          set net:connection-limit 4
          set net:max-retries 6
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 2
          set net:reconnect-interval-max 60
          set cmd:fail-exit yes
          mkdir -p public_html/$RELEASE
          mirror -R --parallel=4 .output/public/ public_html/$RELEASE/

          # public_html/.htaccess exclui /.well-known/ de TODA regra de
          # rewrite pra _current/ (de propósito -- é onde ficam arquivos de
          # verificação tipo assetlinks.json, Google Search Console etc.,
          # que precisam sobreviver independente de qualquer release/swap
          # do site). Por isso esse diretório é sincronizado direto na raiz
          # do public_html, fora do $RELEASE/_current -- senão o arquivo
          # existiria no build mas nunca seria servido de verdade.
          #
          # .well-known e uma pasta ESTAVEL (nao e renomeada/trocada a
          # cada deploy como _release_*/_current) -- a partir do 2o deploy
          # de sempre ela ja existe, e o "mkdir -p" do lftp (diferente do
          # mkdir -p de shell de verdade) trata "550 File exists" como
          # erro em vez de sucesso. fail-exit no só pontualmente pra esse
          # mkdir especifico, voltando pra yes logo em seguida -- o
          # mirror que segue (o que realmente importa que funcione
          # direito) continua estrito.
          set cmd:fail-exit no
          mkdir -p public_html/.well-known
          set cmd:fail-exit yes
          mirror -R --parallel=2 .output/public/.well-known/ public_html/.well-known/

          # robots.txt solto na RAIZ do public_html (subido pelo deploy do
          # meubairro-app até 26/set, com o Sitemap apontando só pro /guia/):
          # arquivo físico na raiz vence o _current no .htaccess, então ele
          # escondia o robots.txt do build deste site. O robots.txt certo
          # (com os sitemaps do site E do /guia/) vem do build e mora em
          # _current. Remove a cópia da raiz a cada deploy -- idempotente:
          # fail-exit no só pro rm, porque "arquivo não existe" (o normal a
          # partir do 2o deploy) não pode falhar o deploy.
          #
          # favicon: a raiz também tem um favicon.svg órfão (logo do Vite,
          # origem desconhecida). Escolha: NÃO apagar arquivo de dono
          # desconhecido -- o favicon do site usa outros nomes
          # (/favicon.ico, /icone-mbb*.svg/png, ver app.head em
          # nuxt.config.ts), que não colidem com ele. Ninguém referencia
          # /favicon.svg, então o órfão ficou inofensivo.
          set cmd:fail-exit no
          rm public_html/robots.txt
          set cmd:fail-exit yes
          bye
          EOF

          echo "Release $RELEASE subida com sucesso (mirror sem erros)."

      - name: Confirma que a release nova esta completa antes de tocar em _current
        # checagem basica de sanidade -- nao prova que o build inteiro
        # esta perfeito, mas pega o caso principal de "mirror terminou sem
        # erro reportado mas a pasta ficou vazia/incompleta por outro
        # motivo". O passo anterior ja e fail-exit estrito, entao chegar
        # aqui ja significa que o mirror não reportou erro -- isso é uma
        # segunda camada, não a única.
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set cmd:fail-exit yes
          cd public_html/$RELEASE
          ls index.html
          bye
          EOF
          echo "Release $RELEASE confirmada -- index.html presente."

      - name: Faz o swap (current -> old, release -> current), passos consecutivos
        # os dois renames ficam o mais proximo possivel um do outro (mesma
        # sessao lftp, sem nada entre eles) -- FTP puro nao suporta um
        # symlink atomico pra _current (isso exigiria SFTP/SSH, que nao
        # esta disponivel nesta hospedagem: ftps:// ja trava a conexao
        # aqui, confirmado antes). Essa janela pequena entre os dois mv é
        # o maximo de atomicidade que da pra conseguir só com FTP.
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          OLD="_old_$(date +%s)"
          echo "OLD=$OLD" >> "$GITHUB_ENV"

          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          # so aqui, e so pro primeiro mv, tolera erro -- no 1o deploy de
          # sempre public_html/_current ainda nao existe (550 doesn't
          # exist), e isso e esperado/normal.
          set cmd:fail-exit no
          mv public_html/_current public_html/$OLD
          set cmd:fail-exit yes
          mv public_html/$RELEASE public_html/_current
          bye
          EOF

          echo "Release $RELEASE agora é public_html/_current. Versão anterior guardada em public_html/$OLD para rollback."

      - name: Confirma que _current existe e o site responde antes de marcar sucesso
        # verificacao pos-rename pedida explicitamente depois do incidente
        # de 23/set. Camadas decisivas, ambas via FTP: (1) index.html existe
        # em _current logo apos o rename, (2) _current/_build.txt bate com o
        # marcador DESTE run -- prova que o swap colocou o build novo no ar.
        # (3) curl no site publico e so complementar: o Cloudflare responde
        # com desafio anti-bot (403 + cf-mitigated: challenge) pra IP de
        # datacenter como o do runner -- todos os "403" dos deploys de 26/set
        # eram isso, com o site no ar. Desafio vira aviso, nao falha. Mas se
        # a ORIGEM responder erro de verdade (404/500/403 sem desafio, ex:
        # .htaccess quebrado), o job ainda falha aqui -- não silencioso.
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set cmd:fail-exit yes
          cd public_html/_current
          ls index.html
          bye
          EOF
          echo "_current confirmado no servidor -- index.html presente pos-rename."

          esperado="commit=${GITHUB_SHA} build_id=${MBB_BUILD_ID} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF > build_remoto.txt
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set cmd:fail-exit yes
          cat public_html/_current/_build.txt
          bye
          EOF
          remoto=$(tr -d '\r\n' < build_remoto.txt)
          if [ "$remoto" != "$esperado" ]; then
            echo "ERRO: _current/_build.txt nao e deste build (esperado: '$esperado', encontrado: '$remoto') -- o swap nao colocou a release nova no ar."
            exit 1
          fi
          echo "_current confirmado como ESTE build via FTP (_build.txt: $remoto)."

          # headers e corpo guardados em arquivo pra diagnostico: quando nao
          # vier 200, o log mostra quem respondeu (server/cf-ray/cf-mitigated
          # = Cloudflare vs Apache) e a pagina de erro.
          headers="$RUNNER_TEMP/verificacao_headers.txt"
          corpo="$RUNNER_TEMP/verificacao_corpo.txt"
          for tentativa in 1 2 3 4 5; do
            status=$(curl -s -D "$headers" -o "$corpo" -w "%{http_code}" --max-time 15 "https://meubairroburitis.com.br/" || true)
            if [ "$status" = "200" ]; then
              echo "Site respondendo 200 na tentativa $tentativa."
              exit 0
            fi
            if grep -qiE '^cf-mitigated:[[:space:]]*challenge' "$headers" 2>/dev/null; then
              echo "::warning::Site nao confirmavel via HTTP: Cloudflare respondeu com desafio anti-bot (cf-mitigated: challenge, status $status) pro IP do runner. Deploy considerado OK pelas camadas FTP (index.html + _build.txt deste build em _current)."
              exit 0
            fi
            echo "Tentativa $tentativa: status $status. Aguardando 5s antes de tentar de novo (Cloudflare/Apache podem levar um instante pra refletir o swap)."
            echo "--- headers-chave (server / cf-ray / cf-mitigated / cf-cache-status):"
            grep -iE '^(server|cf-ray|cf-mitigated|cf-cache-status):' "$headers" 2>/dev/null | tr -d '\r' || echo "(nenhum desses headers presente)"
            echo "--- headers completos:"
            tr -d '\r' < "$headers" 2>/dev/null || true
            echo "--- corpo (primeiros 500 caracteres):"
            head -c 500 "$corpo" 2>/dev/null || true
            echo
            echo "---"
            sleep 5
          done

          echo "ERRO: site nao respondeu 200 depois do swap (ultimo status: $status, sem desafio do Cloudflare -- erro veio da origem ou da rede). _current e este build no servidor mas o site publico nao esta respondendo certo -- investigar manualmente antes de considerar este deploy bem-sucedido."
          exit 1

      # A limpeza das _old_*/_release_* saiu daqui em 08/out: roda em
      # limpeza-releases.yml (ao fim de cada deploy e diariamente), com
      # concorrência própria -- este run termina logo depois da purga.

      - name: Purga cache do Cloudflare
        # sem isso, depois do swap atomico na origem (passo anterior), o
        # Cloudflare pode continuar servindo, POP por POP, HTML/JS de builds
        # anteriores por um tempo -- foi exatamente isso que quebrou a
        # primeira página nova adicionada depois desse deploy existir
        # (/links): o roteador do lado cliente carregava com JS de um build
        # de dias atrás, que não conhecia a rota nova, mesmo o HTML servido
        # pelo Nitro estando correto -- resultado era um "Page not found"
        # renderizado pelo próprio Nuxt no navegador, só em alguns POPs.
        #
        # Purga que falha NÃO derruba o deploy (o site já está no ar quando
        # este step roda), mas também não pode passar despercebida: até
        # 07/out o step saía com ::error + exit 1 dentro de
        # continue-on-error, e o run inteiro ficava VERDE -- os secrets nem
        # existiam e ninguém notou por dias (robots.txt antigo no cache).
        # Agora: ::warning:: (aparece em amarelo no resumo do run) + bloco no
        # Job Summary, e exit 0 explícito. continue-on-error fica como rede
        # de segurança pra qualquer falha inesperada do próprio script.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          faltando=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && faltando="$faltando CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ZONE_ID" ] && faltando="$faltando CLOUDFLARE_ZONE_ID"
          if [ -n "$faltando" ]; then
            echo "::warning title=Purga do Cloudflare NAO executada::Secret(s) ausente(s):$faltando. O cache do Cloudflare continua servindo arquivos de deploys anteriores (robots.txt, favicon.ico, JS antigo) ate expirar ou ate purga manual no painel."
            echo "### ⚠️ Purga do Cloudflare NÃO executada" >> "$GITHUB_STEP_SUMMARY"
            echo "Secret(s) ausente(s):$faltando. Arquivos estáticos antigos continuam no cache até purga manual." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status=$(curl -s -o /tmp/purge-resposta.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true)

          # a resposta da API não contém o token -- seguro imprimir inteira
          echo "status HTTP da purga: $status"
          cat /tmp/purge-resposta.json 2>/dev/null; echo

          # HTTP 200 sozinho não basta: a API do Cloudflare sinaliza erro
          # também no corpo ("success": false, com "errors": [...]).
          if [ "$status" != "200" ] || ! grep -q '"success":[[:space:]]*true' /tmp/purge-resposta.json 2>/dev/null; then
            erros=$(node -e 'try{const r=require("/tmp/purge-resposta.json");console.log((r.errors||[]).map(e=>e.code+" "+e.message).join("; ")||"sem detalhe")}catch(e){console.log("resposta nao-JSON")}')
            echo "::warning title=Purga do Cloudflare NAO executada::HTTP $status -- $erros. Token precisa da permissao Zone > Cache Purge > Purge nesta zona."
            echo "### ⚠️ Purga do Cloudflare NÃO executada" >> "$GITHUB_STEP_SUMMARY"
            echo "HTTP $status -- $erros" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Purga do Cloudflare executada (purge_everything, success: true)."
          echo "### ✅ Purga do Cloudflare executada (purge_everything)" >> "$GITHUB_STEP_SUMMARY"

      # Nota: a regra de rewrite em public_html/.htaccess que faz
      # "/" -> "/_current/" (exceto /guia/ e /.well-known/) é configurada
      # manualmente UMA VEZ, só no dia da virada de fato (desligamento do
      # WordPress) — não faz parte deste workflow.
