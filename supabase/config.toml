project_id = "meubairroburitis-site"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[functions.criar_pagamento]
# checkout é anônimo por design (sem conta de usuário) — a proteção do
# endpoint é rate limiting + revalidação de preço no servidor, não JWT de
# usuário. verify_jwt continua true (exige ao menos a anon key), mas
# nenhuma identidade é checada dentro da função.
verify_jwt = true

[functions.consultar_pagamento]
verify_jwt = true

[functions.mp_webhook]
# o Mercado Pago não envia um JWT do Supabase — a autenticidade da chamada
# é garantida pela validação de x-signature dentro da função, não aqui.
verify_jwt = false

[functions.meus_pedidos_codigo]
# visitante sem login (exige só a anon key); a proteção são os limites por
# número, por IP e o teto diário no banco (meus_pedidos_preparar_codigo).
verify_jwt = true

[functions.moderacao_alerta_email]
# chamada pela edge function moderacao-monitor do projeto do Guia (bot de
# moderação, repo mbb-moderador), que não tem JWT deste projeto; a proteção é
# o segredo compartilhado (x-alerta-segredo) e o destino fixo no servidor.
verify_jwt = false
