name: Diagnostico - Uso de disco no hosting

# Disco cheio ("Disk quota exceeded") bloqueou o deploy #194 -- este
# workflow so LE o estado do servidor (ls -la), nao apaga nada. So usa
# ls porque o "du -sh nome*" nao funciona neste lftp -- ele nao
# expande wildcard nesse comando (tenta abrir um diretorio chamado
# literalmente "_old_*" e falha), so trava ate estourar timeout sem
# agregar informacao nenhuma que o ls -la (nomes + mtimes) ja nao desse.
# Existe separado do deploy.yml/fix-htaccess-seguranca.yml de
# proposito: cada workflow desses so faz uma coisa (mesmo principio ja
# usado no fix-htaccess-seguranca.yml).
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Uso de disco em public_html
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          set cmd:fail-exit no
          cd public_html
          echo "===== ls -la public_html (nivel raiz) ====="
          ls -la
          bye
          EOF
