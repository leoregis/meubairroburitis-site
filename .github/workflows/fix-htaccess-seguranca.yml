name: Fix Seguranca - Bloqueia backup do WordPress

# Uploads so o .htaccess corrigido -- achado real de seguranca: a regra
# anterior deixava wordpress_backup_2026/ acessivel publicamente (PHP
# real executando). So sobe o arquivo, nao mexe em mais nada.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sobe .htaccess corrigido
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          set cmd:fail-exit yes
          cd public_html
          put deploy/htaccess-producao -o .htaccess
          ls -la .htaccess
          bye
          EOF
