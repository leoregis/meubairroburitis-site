name: EMERGENCIA - Restaurar _current

# O deploy #194 falhou por disco cheio no meio do mirror -- com
# cmd:fail-exit no ativo naquele ponto do script, o lftp seguiu em
# frente e renomeou o _current de producao pra _old_1790181451 mesmo
# assim, sem nunca conseguir colocar uma release nova no lugar. Site
# inteiro caiu pra 404 (nao existe mais pasta _current nenhuma).
#
# Este workflow faz UMA coisa: renomeia _old_1790181451 de volta pra
# _current. Nao apaga nada, nao mexe em mais nenhuma pasta. Uso
# unico, pra essa emergencia especifica -- apagar depois que o site
# confirmar no ar.
on:
  workflow_dispatch:

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Renomeia _old_1790181451 -> _current
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          set cmd:fail-exit yes
          cd public_html
          echo "===== ANTES ====="
          ls -la
          mv _old_1790181451 _current
          echo "===== DEPOIS ====="
          ls -la
          bye
          EOF
