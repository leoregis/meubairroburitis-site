name: Aplica .htaccess de producao (com backup)

# Sobe deploy/htaccess-producao como public_html/.htaccess -- arquivo
# sensivel (redirects, bloqueio do backup do WordPress, roteamento pro
# _current). Criado originalmente pro bloqueio do wordpress_backup_2026/
# (achado real de seguranca). Desde 23/out o deploy normal (deploy.yml) ja
# aplica o .htaccess quando ele muda, com o mesmo script
# (deploy/aplicar-htaccess.sh); este workflow fica para aplicar sem build
# (ex.: um 410 urgente com [skip ci]). So sobe esse arquivo.
#
# Disciplina (29/set): backup ANTES (copia no servidor + artifact do run),
# diff do que vai mudar no log, e conferencia DEPOIS (o arquivo no
# servidor tem que ser byte a byte o do repo). Desde 23/out tambem testa / e
# /carrinho e volta o anterior se a ORIGEM der erro; o desafio anti-bot do
# Cloudflare pro IP do runner vira aviso -- testar de fora depois de aplicar.
#
# Rollback: o nome do backup sai no resumo do run; restaurar com
#   put .htaccess.bak_<timestamp> -o .htaccess  (dentro de public_html)
# ou baixando o artifact "htaccess-backup" e subindo como .htaccess.
on:
  workflow_dispatch:

# mesma fila do deploy: nunca mexe no .htaccess no meio de um swap
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Backup, upload, conferencia byte a byte e teste (volta o anterior se a origem der erro)
        id: htaccess
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash deploy/aplicar-htaccess.sh

      - name: Guarda o backup como artifact do run
        if: always() && steps.htaccess.outputs.aplicado == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: htaccess-backup
          path: ${{ runner.temp }}/htaccess-antes.txt
          retention-days: 30
