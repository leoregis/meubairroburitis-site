name: Virada - Reconhecimento (somente leitura)

# So lista o conteudo real da raiz do public_html, NAO altera nada.
# Passo 0 antes da virada de producao (DEPLOY_PLAN.md) -- confirma a
# estrutura exata do WordPress antes de escrever os comandos de rename.
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Lista public_html (raiz do dominio)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 3
          cd public_html
          echo "=== ls -la public_html/ ==="
          ls -la
          echo "=== conteudo de .well-known/ ==="
          ls -la .well-known/
          bye
          EOF
